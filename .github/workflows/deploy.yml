name: Deploy a Cloudflare Workers

# Se ejecuta al hacer push a main, o manualmente desde la pestana Actions.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Si haces varios push seguidos, solo se despliega el ultimo.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

# El flujo solo necesita leer el repositorio; el token no debe poder escribir.
permissions:
  contents: read

jobs:
  test:
    name: Comprobar tipos y tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Tipos
        run: npm run typecheck

      - name: Tests
        run: npm test

  deploy:
    name: Desplegar
    needs: test
    # Con el token de produccion solo se publica la rama principal, tambien
    # cuando el flujo se lanza a mano desde la pestana Actions.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Publicar en Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
